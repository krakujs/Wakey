# Wakey CI — PR gates per docs/engineering-standards.md §4.
# NOTE (E1-T2): execution on PRs requires a public remote; until then this file
# is the contract and the same steps run locally via `make check` + `make test`.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: python scripts/add_spdx_headers.py --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      # Host-safe caps: per-test timeout (pyproject) + ≤4 workers (eng-standards §3)
      # Coverage floor enforced in CI (R-11): below 90% fails the build.
      - run: pytest -n 4 --cov=wakey --cov-report=term-missing --cov-fail-under=90

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wakey:ci .
