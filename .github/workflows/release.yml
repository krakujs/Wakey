# SPDX-License-Identifier: Apache-2.0
# Release workflow (E1-T4): tag → multi-arch images → ghcr.io + Docker Hub.
# Requires these repo secrets before the first release:
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN — Docker Hub push credentials
#   (ghcr.io uses the automatic GITHUB_TOKEN; no extra secret needed)
# PyPI publishing is intentionally NOT enabled in this workflow; add a
# Trusted Publisher on pypi.org when the package is ready for distribution.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write   # SBOM / provenance attestation
  attestations: write

jobs:
  image:
    # Tag pushes are owner actions; the production environment gate
    # (approval) applies to the CD workflow that mutates the live service.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" >> "$GITHUB_ENV"

      - name: Docker Hub login (only when configured)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Meta tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (multi-arch, SBOM + provenance)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
