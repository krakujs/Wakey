[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wakey"
version = "0.1.0"
description = "Wakey — the self-hosted AI SRE that watches your services: log in, ticket out, root cause, suggested fix."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Wakey Authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Quality Assurance",
]

# Platform baseline — first used by the E2-T4 HTTP server; declared here so the
# venv/platform is stable from day one (lean-dependency rule: all are
# Apache/MIT/BSD-licensed, see THIRD-PARTY-NOTICES.md).
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0.2,<7.0",
]

[project.optional-dependencies]
# Encrypted-at-rest credentials (GitHub App private keys, webhook secrets)
# when WAKEY_MASTER_KEY is configured (SEC-4 / E10-T3):
secrets = ["cryptography>=42,<47"]
dev = [
    "cryptography>=42,<47",
    "pytest>=8.3,<10.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.6,<4.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.urls]
Documentation = "https://github.com/wakey-ai/wakey/tree/main/docs"

[project.scripts]
wakey = "wakey.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wakey"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PL"]
ignore = [
    "PLR0913", # many arguments: avoided by design, but adapters may need config bags
    "PLR2004", # magic values: thresholds live in config, tests compare literals
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wakey"]

[[tool.mypy.overrides]]
# optional dependency: imported lazily only when OIDC verification is used
module = ["cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["src/wakey"]
